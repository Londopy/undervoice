name: Targets

# Measures the spec's frame-loss target over 480 frames through the simulated FM channel.
# Too slow for every push, so it runs weekly, on demand, and before a release is worth tagging.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      - run: pytest -m slow -v
